version: '3.8'

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_ENVIRONMENT: ${REACT_APP_ENVIRONMENT}
        REACT_APP_ENABLE_ANALYTICS: ${REACT_APP_ENABLE_ANALYTICS}
        REACT_APP_ENABLE_EXPORTS: ${REACT_APP_ENABLE_EXPORTS}
    container_name: sabpaisa_ui
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - sabpaisa_network

networks:
  sabpaisa_network:
    external: true
